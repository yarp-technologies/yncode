name: YarpNeuro Desktop

on:
  push:
    tags:
      - v*-yarp.*
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to create
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends rpm

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      - name: Package desktop
        working-directory: packages/desktop
        run: bun run package:linux -- --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(packages/desktop/dist/*.AppImage packages/desktop/dist/*.deb packages/desktop/dist/*.rpm)
          if (( ${#files[@]} != 3 )); then
            echo "Expected one AppImage, one deb, and one rpm; found ${#files[@]} files"
            printf '%s\n' packages/desktop/dist/*
            exit 1
          fi
          checksums=packages/desktop/dist/SHA256SUMS
          sha256sum "${files[@]}" > "$checksums"
          release_tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$release_tag" "${files[@]}" "$checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "OpenCode Desktop YarpNeuro $release_tag" \
            --notes "Linux x64 desktop build from $GITHUB_SHA with YarpNeuro as the only built-in provider."

  windows-x64:
    needs: linux-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.sha }}

      - name: Clear Bun install cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:USERPROFILE ".bun\install\cache"
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }

      - uses: ./.github/actions/setup-bun
        with:
          cache: "false"

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      - name: Package desktop
        working-directory: packages/desktop
        run: bun run package:win -- --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Publish Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -LiteralPath packages/desktop/dist -Filter *.exe -File)
          if ($files.Count -ne 1) {
            Write-Output "Expected one Windows installer; found $($files.Count)"
            Get-ChildItem -LiteralPath packages/desktop/dist
            exit 1
          }
          $checksum = Join-Path $files[0].DirectoryName SHA256SUMS-windows-x64
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLower()
          "$hash  $($files[0].Name)" | Set-Content -NoNewline -Path $checksum
          $releaseTag = "${{ inputs.tag || github.ref_name }}"
          gh release upload $releaseTag $files[0].FullName $checksum --repo $env:GITHUB_REPOSITORY --clobber
